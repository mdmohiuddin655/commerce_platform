# Repository-wide analysis baseline for every app and package.
# Task: FND-001. Rules here are intentionally strict because the shared
# contracts (FND-003) rely on exhaustive switches and non-nullable money /
# state fields being checked at compile time.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Contract/state-machine safety: these must fail the build, not warn.
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/generated_plugin_registrant.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # --- correctness ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: false
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    # --- money / precision: doubles must never model minor units ---
    avoid_double_and_int_checks: true
    prefer_int_literals: false
    # --- API hygiene across package boundaries ---
    depend_on_referenced_packages: true
    implementation_imports: true
    library_private_types_in_public_api: true
    public_member_api_docs: false
    # --- style ---
    always_use_package_imports: true
    directives_ordering: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_relative_imports: false
    require_trailing_commas: true
    sort_pub_dependencies: true
    unawaited_futures: true
    use_super_parameters: true
