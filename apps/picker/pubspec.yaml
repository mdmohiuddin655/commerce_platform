# App: picker  (directory: apps/picker)
# Apps depend on packages. Packages never depend on apps.
name: picker_app
description: "picker role application for the shared commerce platform."
publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  cp_contracts:
    path: ../../packages/contracts
  cp_core:
    path: ../../packages/core
  cp_design_system:
    path: ../../packages/design_system
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
